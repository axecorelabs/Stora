name = "stora-vendor-subdomain-router"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Requires the zone (stora.com.ng) to stay on Cloudflare's nameservers --
# this Worker exists specifically so it *can* stay there instead of
# handing the zone to Vercel (which wildcard TLS issuance would otherwise
# require). Cloudflare's own Universal SSL already covers the wildcard for
# free once this route is proxied.
routes = [
  { pattern = "*.stora.com.ng/*", zone_name = "stora.com.ng" },
  # Bare apex added alongside the wildcard so www AND the bare apex both
  # pass through this Worker's rate limiting too -- *.stora.com.ng/* alone
  # never matches the zero-subdomain host. www itself was already covered
  # by the wildcard route (it's a one-level subdomain), but previously hit
  # the reserved-passthrough branch in src/index.js with no rate limiting
  # applied at all -- see MARKETPLACE_SUBDOMAINS below for why it (and the
  # apex) now get the same edge check every vendor slug does.
  { pattern = "stora.com.ng/*", zone_name = "stora.com.ng" }
]

[vars]
# The zone this Worker is routing for -- src/index.js strips this suffix
# off the incoming hostname to recover the vendor slug. Was missing here
# entirely in an earlier deploy: env.ZONE_APEX resolved to undefined, so
# `hostname.endsWith(".undefined")` was false for every real request, and
# ALL traffic -- www, the apex, every vendor subdomain -- hit the "Unknown
# host" 404 branch instead of ever reaching the reserved-subdomain
# passthrough or a real store. Keep this in sync with the `routes` pattern
# above.
ZONE_APEX = "stora.com.ng"

# The store app's own domain, already verified as a Vercel project domain
# via a normal (non-wildcard) record -- every vendor request gets forwarded
# here with the real subdomain preserved in X-Stora-Vendor-Host. Must be
# www.stora.com.ng, NOT the bare apex: stora.com.ng itself unconditionally
# 308-redirects to www.stora.com.ng (a plain apex -> www canonicalization,
# unrelated to this Worker) -- forwarding to the apex meant every vendor
# subdomain request hit that redirect before Next.js ever saw the header,
# landing every visitor on the plain www homepage instead of the store
# they asked for.
STORE_ORIGIN_HOST = "www.stora.com.ng"

# REQUIRED, but deliberately NOT set here -- this file is committed to git,
# and PROXY_SECRET is what lets the store app trust X-Stora-Vendor-Host is
# really coming from this Worker rather than a spoofed request hitting the
# app's own public origin directly. Set it with:
#   npx wrangler secret put PROXY_SECRET
# (paste a long random value, e.g. from `openssl rand -hex 32`) and set
# the identical value as STORA_PROXY_SECRET in the Vercel project's
# environment variables. Without this configured on BOTH sides, every
# vendor subdomain request safely falls back to rendering the plain
# homepage (see src/index.js and apps/store/src/proxy.js) rather than
# trusting an unverified header -- so this being unset breaks the feature,
# it doesn't reopen the vulnerability it exists to close.

# Comma-separated subdomain labels that must NOT be treated as a vendor
# slug, even though they match *.stora.com.ng -- each of these already has
# its own DNS record in the zone (e.g. app.stora.com.ng -> the dashboard's
# own Vercel project) and is passed through unmodified. Add to this list
# before it's ever reachable as a vendor slug, not after.
#
# storage -- R2_PUBLIC_URL (apps/dashboard/.env.local); this zone's public
# image host for Cloudflare R2. Missing here broke every product/store
# image on the live site: requests were getting forwarded into the store
# app instead of served straight from R2.
RESERVED_SUBDOMAINS = "www,app,api,mail,admin,support,help,status,cdn,assets,blog,docs,storage"

# Which of the reserved labels above (plus the bare apex, always included
# implicitly) are the actual marketplace site rather than some other
# reserved service (the dashboard at app, R2 at storage/cdn, etc.) --
# these get the same edge rate-limit check as a real vendor slug, since
# they're genuine end-user browsing/API traffic at real volume, just
# forwarded unchanged rather than rewritten to a per-vendor path. Every
# other reserved label keeps today's plain, unlimited passthrough --
# they're not marketplace browsing traffic and have their own DNS
# records already, so there's no shared budget to apply here.
MARKETPLACE_SUBDOMAINS = "www"

# General browse-traffic rate limiting -- moved here from apps/store's own
# Redis-backed browseLimiter (see src/index.js for why: this is the one
# limiter that fires on nearly every request, so running it at the edge
# means an abusive burst never costs a Redis command or a Vercel
# invocation at all). `period` is a hard Cloudflare constraint: only 10 or
# 60 are valid, no other window. `namespace_id` just needs to be unique
# within this account across all Workers' [[ratelimits]] blocks -- 1001 is
# a placeholder; verify it doesn't collide with anything already
# provisioned on this Cloudflare account before deploying, and change it
# if it does.
[[ratelimits]]
name = "BROWSE_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 180
period = 60
